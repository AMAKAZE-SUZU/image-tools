<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>フォトデコ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&family=Kiwi+Maru:wght@500&family=Yusei+Magic&family=Klee+One:wght@600&family=Hachi+Maru+Pop&family=Dela+Gothic+One&family=RocknRoll+One&family=Mochiy+Pop+One&family=Noto+Serif+JP:wght@600&display=swap">
<style>
:root{
  --bg:#f6f3f7; --surface:#ffffff; --fg:#26222b; --muted:#6c6475; --line:#e3dde8; --field:#faf8fb; --chk:#ebe6ee; --sel:#ff4f8b;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18161b; --surface:#221f26; --fg:#efebf3; --muted:#a9a1b3; --line:#38333f; --field:#2a2630; --chk:#2e2a33; --sel:#ff7aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18161b; --surface:#221f26; --fg:#efebf3; --muted:#a9a1b3; --line:#38333f; --field:#2a2630; --chk:#2e2a33; --sel:#ff7aa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-bottom:16px}
header p{flex-basis:100%;margin:0;color:var(--muted);font-size:.85rem}
h1{font-family:var(--font-display);font-weight:700;font-size:1.5rem;margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:12px}
@media (max-width:920px){.stage{position:static}}
.board{margin:0 auto;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px rgba(30,20,50,.18);background:repeating-conic-gradient(var(--chk) 0 25%, var(--surface) 0 50%) 0 0/18px 18px}
.board canvas{display:block;width:100%;height:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px 16px;display:flex;flex-direction:column;min-width:0}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 8px;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset:first-child{border-top:0}
legend{font-family:var(--font-display);font-weight:700;font-size:.95rem;padding:0;margin-bottom:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>label{flex:1 1 90px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=time],textarea,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
textarea{min-height:56px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:2px}
input[type=file]{font-size:.78rem;color:var(--muted);max-width:100%}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:.76rem;padding:4px 11px}
.btn.danger{border-color:#d4405f;color:#d4405f;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer}
.mini:disabled{opacity:.4;cursor:default}
.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{flex:1 1 auto;font:inherit;font-size:.82rem;padding:8px 10px;border:0;background:var(--field);color:var(--fg);cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:.76rem;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.list li{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.list li.sel{border-color:var(--sel);box-shadow:inset 3px 0 0 var(--sel)}
.list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.list li img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:none;background:var(--line)}
.hint{color:var(--muted);font-size:.78rem;margin:0}
.status{min-height:1.3em}
.val{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:700;margin-left:4px}
.ver{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;text-decoration:none;white-space:nowrap;align-self:center}
a.ver:hover{color:var(--accent);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
.toplink{font-size:.8rem;color:var(--muted);text-decoration:none;flex-basis:100%}
.toplink:hover{text-decoration:underline}
details.more summary{cursor:pointer;font-size:.82rem;color:var(--fg);font-weight:700}
details.more>div{display:flex;flex-direction:column;gap:10px;margin-top:10px}

/* Layout: 左に仕上がりの大きなプレビュー(チェキ風ではスタンプを動かしたり落書きしたりできる)、右にモードごとの設定 */
:root{--accent:#e0457b; --accent-fg:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#ff8db3; --accent-fg:#2a0d17}}
:root[data-theme="dark"]{--accent:#ff8db3; --accent-fg:#2a0d17}
.board.draw{cursor:crosshair} .board.move{cursor:grab}
.board{touch-action:none}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamps button{font:inherit;font-size:1.05rem;width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--fg);cursor:pointer}
.panelbox{display:flex;flex-direction:column;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.panelbox b{font-size:.82rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="toplink" href="./">← ツール一覧</a>
    <h1>フォトデコ</h1>
    <a class="ver" href="./#changelog" title="更新履歴を見る">v1.0 ・ 2026-10-31 公開</a>
    <p>写真をチェキ・プリ風にしたり、ステッカーやドット絵、雑誌の表紙風、漫画のコマ風にしたりできます。</p>
  </header>
  <div class="grid">
    <div class="stage">
      <div class="board" id="board"><canvas id="cv"></canvas></div>
      <div class="actions">
        <button class="btn" id="save" type="button">PNGで保存</button>
        <span class="hint" id="sizeLabel"></span>
      </div>
      <p class="hint" id="stageHint"></p>
      <p class="hint status" id="msg" role="status" aria-live="polite"></p>
    </div>

    <div class="panel">
      <fieldset>
        <legend>モード</legend>
        <div class="tabs" id="modeTabs">
          <button type="button" data-v="cheki">チェキ・プリ風</button>
          <button type="button" data-v="sticker">ステッカー</button>
          <button type="button" data-v="pixel">ドット絵</button>
          <button type="button" data-v="mag">雑誌の表紙風</button>
          <button type="button" data-v="manga">漫画のコマ風</button>
        </div>
      </fieldset>

      <fieldset id="photoBox">
        <legend>写真</legend>
        <label>写真を選ぶ<input type="file" id="photo" accept="image/*"></label>
        <div class="row"><label>大きさ<input type="range" id="pS" min="50" max="300" step="1"></label></div>
        <div class="row"><label>横位置<input type="range" id="pX" min="-100" max="100" step="1"></label><label>縦位置<input type="range" id="pY" min="-100" max="100" step="1"></label></div>
      </fieldset>

      <!-- チェキ・プリ風 -->
      <fieldset id="chekiBox">
        <legend>チェキ・プリ風</legend>
        <div class="row"><label>形<select id="chForm"><option value="square">正方形</option><option value="mini">縦長(ミニ)</option><option value="wide">横長(ワイド)</option></select></label>
          <label>フチの色<select id="chFrame"><option value="white">白</option><option value="pink">ピンク</option><option value="mint">ミント</option><option value="black">黒</option><option value="pastel">パステルのしま</option><option value="dots">水玉</option></select></label></div>
        <label>写真の色<select id="chFilter"><option value="none">そのまま</option><option value="soft">明るくふんわり(プリ風)</option><option value="retro">レトロ</option><option value="mono">モノクロ</option></select></label>
        <label>下に書く文字<input type="text" id="chCaption"></label>
        <div class="row"><label>文字のフォント<select id="chFont"></select></label><label style="flex:0 1 80px">文字の色<input type="color" id="chCapColor"></label></div>
        <div class="row"><label class="check"><input type="checkbox" id="chDateOn"> 日付を入れる</label><label><input type="date" id="chDate"></label></div>
        <p class="hint" style="margin-top:4px"><b>スタンプ</b>(押すと写真の真ん中に置かれます。ドラッグで動かす・ホイールか下のボタンで大きさ)</p>
        <div class="stamps" id="stampBtns"></div>
        <div class="row"><label>スタンプの文字<input type="text" id="stampText" placeholder="例:LOVE / BEST / ずっ友"></label><button class="btn ghost small" id="stampTextAdd" type="button" style="align-self:end">文字スタンプを置く</button></div>
        <div class="row"><label style="flex:0 1 90px">スタンプ・ペンの色<input type="color" id="decoColor"></label><label>ペンの太さ<input type="range" id="penW" min="2" max="30" step="1"></label></div>
        <div class="btns">
          <button class="btn small" id="penMode" type="button" aria-pressed="false">✎ 落書きする</button>
          <button class="mini" id="selBig" type="button">選んだスタンプを大きく</button><button class="mini" id="selSmall" type="button">小さく</button><button class="mini" id="selRot" type="button">回す</button><button class="mini" id="selDel" type="button">消す</button>
        </div>
        <div class="btns"><button class="mini" id="undo" type="button">ひとつ戻す</button><button class="btn danger small" id="clearDeco" type="button">スタンプと落書きを全部消す</button></div>
        <label class="check"><input type="checkbox" id="chClear"> まわりを透明にして保存(フチの外)</label>
      </fieldset>

      <!-- ステッカー -->
      <fieldset id="stickerBox">
        <legend>ステッカー</legend>
        <p class="hint">背景を透明にした画像(切り抜いたPNG)にフチと影を付けて、シールのようにします。背景が単色の画像なら「背景の色を消す」で消せます。</p>
        <label class="check"><input type="checkbox" id="stRemove"> 背景の色を消す(画像のまわりと同じ色の部分)</label>
        <div class="row" id="stTolBox"><label>消す色の幅<input type="range" id="stTol" min="2" max="120" step="1"></label></div>
        <div class="row"><label>フチの太さ<input type="range" id="stBorder" min="0" max="80" step="1"></label><label style="flex:0 1 80px">フチの色<input type="color" id="stColor"></label></div>
        <div class="row"><label>外側のフチ<input type="range" id="stBorder2" min="0" max="40" step="1"></label><label style="flex:0 1 80px">色<input type="color" id="stColor2"></label></div>
        <div class="row"><label>影<input type="range" id="stShadow" min="0" max="100" step="1"></label><label>少し傾ける<input type="range" id="stRot" min="-20" max="20" step="1"></label></div>
      </fieldset>

      <!-- ドット絵 -->
      <fieldset id="pixelBox">
        <legend>ドット絵</legend>
        <div class="row"><label>横のドット数<input type="range" id="pxN" min="16" max="160" step="1"></label></div>
        <div class="row"><label>色の数<select id="pxPal"><option value="0">そのまま</option><option value="32">32色</option><option value="16">16色</option><option value="8">8色</option><option value="4">4色</option><option value="gb">ゲーム機風(緑4色)</option><option value="mono">白黒2色</option></select></label>
          <label>あざやかさ<input type="range" id="pxSat" min="50" max="200" step="1"></label></div>
        <div class="row"><label>保存する大きさ<select id="pxOut"><option value="1024">長い辺 約1024px</option><option value="2048">長い辺 約2048px</option><option value="512">長い辺 約512px</option><option value="1">ドット1つ=1px</option></select></label><label class="check" style="align-self:end"><input type="checkbox" id="pxGrid"> マス目を入れる</label></div>
      </fieldset>

      <!-- 雑誌の表紙風 -->
      <fieldset id="magBox">
        <legend>雑誌の表紙風</legend>
        <div class="row"><label>雑誌の名前<input type="text" id="mgTitle"></label><label style="flex:0 1 80px">色<input type="color" id="mgColor"></label></div>
        <div class="row"><label>号数など<input type="text" id="mgIssue"></label><label>フォント<select id="mgFont"></select></label></div>
        <label>見出し(1行に1つ。1行目がいちばん大きくなります)<textarea id="mgLines" rows="4"></textarea></label>
        <div class="row"><label>表紙の人の名前(下に大きく)<input type="text" id="mgName"></label><label>丸い飾りの文字<input type="text" id="mgBadge"></label></div>
        <label class="check"><input type="checkbox" id="mgBar"> バーコード風の飾りを入れる</label>
      </fieldset>

      <!-- 漫画のコマ風 -->
      <fieldset id="mangaBox">
        <legend>漫画のコマ風</legend>
        <div class="row"><label>コマ割り<select id="mnLayout"><option value="4koma">4コマ(たて)</option><option value="2x2">2×2</option><option value="3">3コマ(上・まん中で2つ・下)</option><option value="dyn">ななめ割り(4コマ)</option></select></label>
          <label>吹き出しの文字<select id="mnVert"><option value="v">たて書き</option><option value="h">よこ書き</option></select></label></div>
        <div class="row"><label class="check"><input type="checkbox" id="mnMono"> 白黒にする</label><label class="check"><input type="checkbox" id="mnTone"> 網点(スクリーントーン)</label></div>
        <label>タイトル(上に入ります。省略可)<input type="text" id="mnTitle"></label>
        <div id="mnPanels" style="display:flex;flex-direction:column;gap:8px"></div>
      </fieldset>
    </div>
  </div>
</div>

<script>
/* ===== 共通の部品(画像作成ツール) ===== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const R = Math.round;
const FONTS = [
  {name:"Zen Maru Gothic(丸ゴシック)", fam:"Zen Maru Gothic", w:700},
  {name:"M PLUS Rounded 1c(丸ゴシック太)", fam:"M PLUS Rounded 1c", w:800},
  {name:"Kiwi Maru(やわらか明朝)", fam:"Kiwi Maru", w:500},
  {name:"Klee One(手書き風)", fam:"Klee One", w:600},
  {name:"Yusei Magic(マーカー風)", fam:"Yusei Magic", w:400},
  {name:"Hachi Maru Pop(まるもじ)", fam:"Hachi Maru Pop", w:400},
  {name:"Mochiy Pop One(ポップ)", fam:"Mochiy Pop One", w:400},
  {name:"RocknRoll One(太ゴシック)", fam:"RocknRoll One", w:400},
  {name:"Dela Gothic One(極太)", fam:"Dela Gothic One", w:400},
  {name:"Noto Serif JP(明朝)", fam:"Noto Serif JP", w:600},
];
const fontOf = fam => FONTS.find(f => f.fam===fam) || FONTS[0];
const fontStr = (f, px, w) => `${w||f.w} ${Math.max(1,px)}px "${f.fam}", "Zen Maru Gothic", sans-serif`;
function fontOptions(sel, cur){ sel.innerHTML=''; for(const f of FONTS){ const o=document.createElement('option'); o.value=f.fam; o.textContent=f.name; if(f.fam===cur) o.selected=true; sel.appendChild(o); } }
const loadFont = (f, text) => document.fonts ? document.fonts.load(fontStr(f, 40), text || 'あA1').catch(()=>{}) : Promise.resolve();

/* 色 */
function rgbOf(hex){ const n = parseInt(String(hex||'#888888').replace('#','').padEnd(6,'0').slice(0,6), 16); return [n>>16, (n>>8)&255, n&255]; }
const hexOf = (r,g,b) => '#' + [r,g,b].map(v => clamp(R(v),0,255).toString(16).padStart(2,'0')).join('');
function mix(a, b, t){ const A=rgbOf(a), B=rgbOf(b); return hexOf(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
const light = (c, t) => mix(c, '#ffffff', t), dark = (c, t) => mix(c, '#000000', t);
function rgba(hex, a){ const [r,g,b] = rgbOf(hex); return `rgba(${r},${g},${b},${clamp(a,0,1)})`; }
function lum(hex){ const [r,g,b] = rgbOf(hex); return (r*.299 + g*.587 + b*.114)/255; }
const onColor = hex => lum(hex) > .62 ? '#2a2230' : '#ffffff';   // 色の上にのせる文字の色

/* 画像 */
function loadImg(blob){ return new Promise((res, rej) => { if(!blob) return res(null); const u = URL.createObjectURL(blob), im = new Image();
  im.onload = () => { im._blob = blob; im._url = u; res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u; }); }
// 枠いっぱいに入れる(adj:大きさ%・位置-100〜100)
function drawCover(g, im, x, y, w, h, adj){
  if(!im) return; const iw = im.naturalWidth||im.width, ih = im.naturalHeight||im.height, a = adj||{};
  const k = Math.max(w/iw, h/ih) * (a.s ?? 100)/100, dw = iw*k, dh = ih*k;
  const ox = (a.x||0)/100*w*.5, oy = (a.y||0)/100*h*.5;   // 右・下へ動かす
  g.drawImage(im, x + (w-dw)/2 + ox, y + (h-dh)/2 + oy, dw, dh);
}
function drawContain(g, im, x, y, w, h){ if(!im) return; const iw = im.naturalWidth||im.width, ih = im.naturalHeight||im.height, k = Math.min(w/iw, h/ih); g.drawImage(im, x+(w-iw*k)/2, y+(h-ih*k)/2, iw*k, ih*k); }

/* 文字(日本語の行頭禁則つきで折り返す) */
const NO_START = '、。，．,.！？!?）)」』】〉》ーぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ～〜…‥';
function wrapText(g, text, maxW){
  const out = [];
  for(const para of String(text||'').split('\n')){
    if(para===''){ out.push(''); continue; }
    let line = '';
    for(const ch of [...para]){
      if(line && g.measureText(line+ch).width > maxW && !NO_START.includes(ch)){ out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  }
  return out;
}
// 枠に収まる大きさを探す(はじめの大きさから小さくしていく)
function fitText(g, text, f, maxW, maxH, size, lh=1.3, maxLines=99){
  let lines = [];
  for(let i=0;i<60;i++){
    g.font = fontStr(f, size); lines = wrapText(g, text, maxW);
    const wd = Math.max(0, ...lines.map(l => g.measureText(l).width));
    if((lines.length*size*lh <= maxH && wd <= maxW*1.01 && lines.length <= maxLines) || size < 6) break;
    size *= .94;
  }
  g.font = fontStr(f, size); return {size, lines};
}
// 1行に収める(長いときだけ小さくする)
function fitLine(g, text, f, maxW, size, w){ g.font = fontStr(f, size, w); const tw = g.measureText(text).width; if(tw > maxW) size *= maxW/tw; g.font = fontStr(f, size, w); return size; }

async function saveZip(entries, zipName, onProgress){   // entries: [{name, blob}]
  if(typeof JSZip==='undefined') throw new Error('nozip');
  const zip = new JSZip(), used = new Set();
  entries.forEach(e => { let n = e.name, k = 2; const m = n.replace(/(\.[^.]+)$/, ''), ext = n.slice(m.length); while(used.has(n)) n = `${m}(${k++})${ext}`; used.add(n); zip.file(n, e.blob); });

  return saveFile(zipName, z);
}

function makeStore(dbName){
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try{ const r = indexedDB.open(dbName, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }));

  return { get: k => tx('readonly', st => st.get(k)), put: (k, v) => tx('readwrite', st => st.put(v, k)) };
}

let stCache = {key:'', cut:null};
function stickerSource(){
  const im = src(), iw = im.naturalWidth||im.width, ih = im.naturalHeight||im.height, k = Math.min(1, 1400/Math.max(iw,ih));
  const w = Math.max(1, R(iw*k)), h = Math.max(1, R(ih*k)), key = [im._url||'s', w, h, S.st.remove, S.st.tol].join('|');
  if(stCache.key===key) return stCache.cut;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', {willReadFrequently:true}); g.drawImage(im, 0, 0, w, h);
  if(S.st.remove){

    const id = g.getImageData(0,0,w,h), d = id.data, seen = new Uint8Array(w*h), tol = S.st.tol, st = [];
    const ref = (()=>{ const ps = [0, w-1, (h-1)*w, h*w-1]; let r=0,gg=0,b=0; for(const p of ps){ r+=d[p*4]; gg+=d[p*4+1]; b+=d[p*4+2]; } return [r/4, gg/4, b/4]; })();
    const near = p => { const dr = d[p*4]-ref[0], dg = d[p*4+1]-ref[1], db = d[p*4+2]-ref[2]; return d[p*4+3] < 20 || Math.sqrt(dr*dr+dg*dg+db*db) <= tol; };
    for(let x=0;x<w;x++){ st.push(x, (h-1)*w+x); } for(let y=0;y<h;y++){ st.push(y*w, y*w+w-1); }
    while(st.length){ const p = st.pop(); if(seen[p] || !near(p)) continue; seen[p] = 1; d[p*4+3] = 0; const x = p%w, y = (p/w)|0;
      if(x>0) st.push(p-1); if(x<w-1) st.push(p+1); if(y>0) st.push(p-w); if(y<h-1) st.push(p+w); }
    // ふちを少しなじませる
    for(let p=0;p<w*h;p++){ if(seen[p]) continue; const x = p%w, y = (p/w)|0; if((x>0&&seen[p-1])||(x<w-1&&seen[p+1])||(y>0&&seen[p-w])||(y<h-1&&seen[p+w])) d[p*4+3] = Math.min(d[p*4+3], 150); }
    g.putImageData(id, 0, 0);
  }

}

function kmeans(px, k){

    for(let i=0;i<n;i++){ let best=0, bd=1e9; for(let c=0;c<k;c++){ const dr=px[i*3]-cent[c][0], dg=px[i*3+1]-cent[c][1], db=px[i*3+2]-cent[c][2], dd=dr*dr+dg*dg+db*db; if(dd<bd){ bd=dd; best=c; } } asg[i]=best; }

    sum.forEach((s, c) => { if(s[3]) cent[c] = [s[0]/s[3], s[1]/s[3], s[2]/s[3]]; });
  }
  return {cent, asg};
}

    g.fillStyle = '#fff'; const t2 = fitText(g, S.mg.badge, body, r*1.4, r*1.3, 52, 1.15); drawTextLines(g, t2.lines, bx, by - t2.lines.length*t2.size*1.15/2, t2.size, 1.15, 'center'); }

    let x = bx; for(let i=0; x < bx + bw; i++){ const w = 1 + Math.floor(rnd(i, 99)*4); if(i%2===0) g.fillRect(x, by, w, bh); x += w; }
    g.font = fontStr(body, 16, 500); g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(S.mg.issue ? S.mg.issue.replace(/\s+/g,' ').slice(0,22) : '', bx + bw/2, by + bh + 4); }

/* ===== 漫画のコマ風 ===== */
const LAYOUTS = {
  '4koma': [[[0,0],[1,0],[1,.25],[0,.25]], [[0,.25],[1,.25],[1,.5],[0,.5]], [[0,.5],[1,.5],[1,.75],[0,.75]], [[0,.75],[1,.75],[1,1],[0,1]]],
  '2x2': [[[0,0],[.5,0],[.5,.5],[0,.5]], [[.5,0],[1,0],[1,.5],[.5,.5]], [[0,.5],[.5,.5],[.5,1],[0,1]], [[.5,.5],[1,.5],[1,1],[.5,1]]],
  '3': [[[0,0],[1,0],[1,.36],[0,.36]], [[0,.36],[.56,.36],[.46,.68],[0,.68]], [[.56,.36],[1,.36],[1,.68],[.46,.68]], [[0,.68],[1,.68],[1,1],[0,1]]],
  'dyn': [[[0,0],[1,0],[1,.22],[0,.3]], [[0,.3],[1,.22],[1,.55],[0,.6]], [[0,.6],[.6,.57],[.48,1],[0,1]], [[.6,.57],[1,.55],[1,1],[.48,1]]],
};
const VROT = 'ー〜～…‥―-—()（）「」『』【】[]〈〉《》<>=＝';
function vText(g, text, cx, cy, size){
  const cols = String(text).split('\n'), lh = size*1.08, cw = size*1.25, total = (cols.length-1)*cw, maxLen = Math.max(...cols.map(c => [...c].length));
  cols.forEach((col, ci) => { const x = cx + total/2 - ci*cw; [...col].forEach((ch, i) => { const y = cy - (maxLen-1)*lh/2 + i*lh;
    if(VROT.includes(ch)){ g.save(); g.translate(x, y); g.rotate(Math.PI/2); g.fillText(ch, 0, 0); g.restore(); }
    else if('、。'.includes(ch)) g.fillText(ch, x + size*.55, y - size*.5); else g.fillText(ch, x, y); }); });
  return {w: total + size, h: maxLen*lh};
}
function bubble(g, text, cx, cy, size, vert, tailTo){
  const f = fontOf('M PLUS Rounded 1c'); g.font = fontStr(f, size, 800); g.textAlign = 'center'; g.textBaseline = 'middle';
  const cols = String(text).split('\n'); let bw, bh;
  if(vert){ bw = cols.length*size*1.25 + size*.6; bh = Math.max(...cols.map(c => [...c].length))*size*1.08 + size*.4; }
  else { bw = Math.max(...cols.map(c => g.measureText(c).width)) + size*.6; bh = cols.length*size*1.25 + size*.3; }
  const rx = bw*.72, ry = bh*.72;
  g.fillStyle = '#fff'; g.strokeStyle = '#111'; g.lineWidth = size*.14;
  if(tailTo){ g.beginPath(); const a = Math.atan2(tailTo[1]-cy, tailTo[0]-cx); g.moveTo(cx + Math.cos(a+.25)*rx*.8, cy + Math.sin(a+.25)*ry*.8); g.lineTo(tailTo[0], tailTo[1]); g.lineTo(cx + Math.cos(a-.25)*rx*.8, cy + Math.sin(a-.25)*ry*.8); g.closePath(); g.fill(); g.stroke(); }
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); g.fill(); g.stroke();
  if(tailTo){ g.beginPath(); const a = Math.atan2(tailTo[1]-cy, tailTo[0]-cx); g.moveTo(cx + Math.cos(a+.25)*(rx*.8-size*.1), cy + Math.sin(a+.25)*(ry*.8-size*.1)); g.lineTo(cx + Math.cos(a)*rx*.95, cy + Math.sin(a)*ry*.95); g.lineTo(cx + Math.cos(a-.25)*(rx*.8-size*.1), cy + Math.sin(a-.25)*(ry*.8-size*.1)); g.closePath(); g.fill(); }
  g.fillStyle = '#111';
  if(vert) vText(g, text, cx, cy, size); else cols.forEach((c, i) => g.fillText(c, cx, cy - (cols.length-1)*size*1.25/2 + i*size*1.25));

}
function focusLines(g, x, y, w, h){
  const cx = x + w/2, cy = y + h/2, R1 = Math.hypot(w, h)*.6; g.fillStyle = '#111';
  for(let i=0;i<120;i++){ const a = rnd(i,51)*Math.PI*2, wd = .004 + rnd(i,52)*.012, r0 = Math.min(w,h)*(.32 + rnd(i,53)*.18);
    g.beginPath(); g.moveTo(cx + Math.cos(a-wd)*R1, cy + Math.sin(a-wd)*R1); g.lineTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0); g.lineTo(cx + Math.cos(a+wd)*R1, cy + Math.sin(a+wd)*R1); g.fill(); }
}
function tone(g, x, y, w, h){
  const t = document.createElement('canvas'); t.width = 12; t.height = 12; const tg = t.getContext('2d'); tg.fillStyle = 'rgba(0,0,0,.28)'; tg.beginPath(); tg.arc(3,3,1.8,0,Math.PI*2); tg.arc(9,9,1.8,0,Math.PI*2); tg.fill();

}
function drawManga(g){
  const W = 1000, H = 1414; g.canvas.width = W; g.canvas.height = H; g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
  const top = S.mn.title ? 110 : 50, mg = 50, gut = 16, area = {x: mg, y: top, w: W - mg*2, h: H - top - mg};
  if(S.mn.title){ const f = fontOf('Dela Gothic One'); const s = fitLine(g, S.mn.title, f, W*.8, 56); g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(S.mn.title, W/2, 60); }

  L.forEach((poly, i) => {
    const p = S.mn.panels[i] || (S.mn.panels[i] = {text:'', pos:'tr', lines:false, s:100, x:0, y:0});
    const inner = poly.map(([x, y]) => [area.x + x*area.w, area.y + y*area.h]);
    const xs = inner.map(q=>q[0]), ys = inner.map(q=>q[1]), bx = Math.min(...xs), by = Math.min(...ys), bw = Math.max(...xs)-bx, bh = Math.max(...ys)-by;
    const path = () => { g.beginPath(); inner.forEach(([x,y], k) => k ? g.lineTo(x,y) : g.moveTo(x,y)); g.closePath(); };
    g.save(); path(); g.clip();
    const im = panelImgs[i] || (i===0 ? photoImg : null) || SAMPLE;
    g.filter = S.mn.mono ? 'grayscale(1) contrast(1.25) brightness(1.05)' : 'none'; drawCover(g, im, bx, by, bw, bh, p); g.filter = 'none';

    // コマのすき間と枠線:コマの中だけに太い線を引く(外側半分は切り取られる)
    g.save(); path(); g.clip(); path(); g.lineWidth = gut + 12; g.strokeStyle = '#111'; g.stroke(); g.lineWidth = gut; g.strokeStyle = '#fff'; g.stroke(); g.restore();
    if((p.text||'').trim()){
      const size = Math.min(bw, bh)*(S.mn.vert==='v' ? .1 : .085), vert = S.mn.vert==='v';
      const right = p.pos.includes('r'), topP = p.pos.includes('t');
      g.save(); path(); g.clip();
      const bxx = right ? bx + bw*.78 : bx + bw*.22, byy = topP ? by + bh*.3 : by + bh*.7;
      bubble(g, p.text, bxx, byy, size, vert, [bx + bw*.5, by + bh*(topP ? .62 : .4)]);

bind('mnLayout', el => S.mn.layout = el.value, 'change', buildPanels); bind('mnVert', el => S.mn.vert = el.value, 'change'); bind('mnMono', el => S.mn.mono = el.checked, 'change'); bind('mnTone', el => S.mn.tone = el.checked, 'change'); bind('mnTitle', el => S.mn.title = el.value);

/* ===== スタンプと落書き(チェキ・プリ風) ===== */
let selDeco = null, penOn = false, drag = null;
const artW = () => (FORMS[S.ch.form] || FORMS.square).W;
function toArt(e){ const r = cv.getBoundingClientRect(), k = cv.width/r.width, m = lastInfo?.m || 0; return [((e.clientX - r.left)*k - m)/artW(), ((e.clientY - r.top)*k - m)/artW()]; }
function hit(x, y){ const W = artW(); for(let i=S.ch.deco.length-1;i>=0;i--){ const d = S.ch.deco[i]; if(d.kind==='pen') continue; const b = stampBox(d, W); if(Math.abs(x*W - d.x*W) <= b.rx+10 && Math.abs(y*W - d.y*W) <= b.ry+10) return d; } return null; }
function addStamp(kind, text){ const F = FORMS[S.ch.form] || FORMS.square, [px,py,pw,ph] = F.ph; const d = {kind, text, color:S.ch.color, x:(px+pw/2)/F.W + (Math.random()-.5)*.1, y:(py+ph/2)/F.W + (Math.random()-.5)*.1, s:kind==='text' ? .16 : .14, rot:(Math.random()-.5)*24};
  S.ch.deco.push(d); selDeco = d; setPen(false); saveS(); redraw(); }
STAMPS.forEach(([k, label]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-label', label+'のスタンプ'); b.onclick = () => addStamp(k); $('stampBtns').appendChild(b); });
$('stampTextAdd').onclick = () => { const t = $('stampText').value.trim(); if(!t){ msg('スタンプの文字を入れてください。'); return; } addStamp('text', t); };
function setPen(on){ penOn = on; $('penMode').setAttribute('aria-pressed', on); $('penMode').textContent = on ? '✎ 落書き中(押すと終わる)' : '✎ 落書きする'; board.classList.toggle('draw', on); board.classList.toggle('move', !on); if(on) selDeco = null; redraw(); }
$('penMode').onclick = () => setPen(!penOn);
const scaleSel = k => { if(!selDeco) return msg('先にプレビューでスタンプを選んでください。'); selDeco.s = clamp(selDeco.s*k, .03, .8); saveS(); redraw(); };
$('selBig').onclick = () => scaleSel(1.15); $('selSmall').onclick = () => scaleSel(1/1.15);
$('selRot').onclick = () => { if(!selDeco) return msg('先にプレビューでスタンプを選んでください。'); selDeco.rot = ((selDeco.rot||0) + 15) % 360; saveS(); redraw(); };
$('selDel').onclick = () => { if(!selDeco) return msg('先にプレビューでスタンプを選んでください。'); S.ch.deco = S.ch.deco.filter(d => d!==selDeco); selDeco = null; saveS(); redraw(); };
$('undo').onclick = () => { S.ch.deco.pop(); selDeco = null; saveS(); redraw(); };
armButton($('clearDeco'), 'スタンプと落書きを全部消す', 'もう一度押すと全部消す', () => { S.ch.deco = []; selDeco = null; saveS(); redraw(); });
board.addEventListener('pointerdown', e => {
  if(S.mode!=='cheki') return; e.preventDefault(); const [x, y] = toArt(e);
  if(penOn){ const d = {kind:'pen', color:S.ch.color, w:S.ch.penW, pts:[[x,y]]}; S.ch.deco.push(d); drag = {pen:d}; }
  else { const d = hit(x, y); selDeco = d; if(d){ drag = {d, ox:x - d.x, oy:y - d.y}; $('decoColor').value = d.color; } }
  board.setPointerCapture(e.pointerId); redraw();
});
board.addEventListener('pointermove', e => { if(!drag) return; const [x, y] = toArt(e);
  if(drag.pen){ const pts = drag.pen.pts, l = pts[pts.length-1]; if(Math.hypot(x-l[0], y-l[1]) > .002) pts.push([x, y]); }
  else { drag.d.x = x - drag.ox; drag.d.y = y - drag.oy; } redraw(); });
const endDrag = () => { if(drag){ drag = null; saveS(); } };
board.addEventListener('pointerup', endDrag); board.addEventListener('pointercancel', endDrag);
board.addEventListener('wheel', e => { if(S.mode!=='cheki' || !selDeco) return; e.preventDefault(); selDeco.s = clamp(selDeco.s*(e.deltaY<0 ? 1.08 : 1/1.08), .03, .8); saveS(); redraw(); }, {passive:false});
addEventListener('keydown', e => { if(S.mode==='cheki' && selDeco && (e.key==='Delete' || e.key==='Backspace') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ S.ch.deco = S.ch.deco.filter(d => d!==selDeco); selDeco = null; saveS(); redraw(); } });

/* ===== 保存 ===== */
const NAMES = {cheki:'cheki', sticker:'sticker', pixel:'pixel', mag:'magazine', manga:'manga'};
$('save').onclick = async () => {
  await Promise.all([loadFont(fontOf(S.ch.font), S.ch.caption), loadFont(fontOf(S.mg.font), S.mg.title+S.mg.name+S.mg.badge), loadFont(fontOf('M PLUS Rounded 1c'), S.mg.lines+S.mn.panels.map(p=>p.text).join('')+S.mg.issue+S.mg.badge), loadFont(fontOf('Mochiy Pop One'), S.ch.deco.map(d=>d.text||'').join('')), loadFont(fontOf('Dela Gothic One'), S.mn.title)]);
  const keep = selDeco; selDeco = null; const c = document.createElement('canvas'); renderTo(c); selDeco = keep;
  const name = `${NAMES[S.mode]}_${stamp()}.png`; const r = await saveFile(name, await toBlob(c)); msg(resultMsg(r, `${name} を保存しました(${c.width}×${c.height}px)。`));
};

/* ===== 起動 ===== */
(async () => {
  try{ const d = await store.get('imgs'); if(d){ if(d.photo) photoImg = await loadImg(d.photo).catch(()=>null); (d.panels||[]).forEach(async (b, i) => { if(b){ panelImgs[i] = await loadImg(b).catch(()=>null); redraw(); } }); } }catch(e){}
  syncUI(); redraw(); if(document.fonts) document.fonts.ready.then(redraw);
  Promise.all([loadFont(fontOf(S.ch.font)), loadFont(fontOf(S.mg.font)), loadFont(fontOf('Mochiy Pop One')), loadFont(fontOf('M PLUS Rounded 1c'))]).then(redraw);
})();
window.__tool = {get S(){ return S; }, renderTo};   // 動作確認用
</script>
</body>
