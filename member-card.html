<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>メンバーカードメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&family=Kiwi+Maru:wght@500&family=Yusei+Magic&family=Klee+One:wght@600&family=Hachi+Maru+Pop&family=Dela+Gothic+One&family=RocknRoll+One&family=Mochiy+Pop+One&family=Noto+Serif+JP:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f6f3f7; --surface:#ffffff; --fg:#26222b; --muted:#6c6475; --line:#e3dde8; --field:#faf8fb; --chk:#ebe6ee; --sel:#ff4f8b;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18161b; --surface:#221f26; --fg:#efebf3; --muted:#a9a1b3; --line:#38333f; --field:#2a2630; --chk:#2e2a33; --sel:#ff7aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18161b; --surface:#221f26; --fg:#efebf3; --muted:#a9a1b3; --line:#38333f; --field:#2a2630; --chk:#2e2a33; --sel:#ff7aa8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.6}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-bottom:16px}
header p{flex-basis:100%;margin:0;color:var(--muted);font-size:.85rem}
h1{font-family:var(--font-display);font-weight:700;font-size:1.5rem;margin:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0;position:sticky;top:12px}
@media (max-width:920px){.stage{position:static}}
.board{margin:0 auto;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px rgba(30,20,50,.18);background:repeating-conic-gradient(var(--chk) 0 25%, var(--surface) 0 50%) 0 0/18px 18px}
.board canvas{display:block;width:100%;height:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px 16px;display:flex;flex-direction:column;min-width:0}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:12px 0 8px;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset:first-child{border-top:0}
legend{font-family:var(--font-display);font-weight:700;font-size:.95rem;padding:0;margin-bottom:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>label{flex:1 1 90px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=time],textarea,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%}
textarea{min-height:56px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:2px}
input[type=file]{font-size:.78rem;color:var(--muted);max-width:100%}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:.76rem;padding:4px 11px}
.btn.danger{border-color:#d4405f;color:#d4405f;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer}
.mini:disabled{opacity:.4;cursor:default}
.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{flex:1 1 auto;font:inherit;font-size:.82rem;padding:8px 10px;border:0;background:var(--field);color:var(--fg);cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:.76rem;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.list li{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.list li.sel{border-color:var(--sel);box-shadow:inset 3px 0 0 var(--sel)}
.list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.list li img{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:none;background:var(--line)}
.hint{color:var(--muted);font-size:.78rem;margin:0}
.status{min-height:1.3em}
.val{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:700;margin-left:4px}
.ver{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;text-decoration:none;white-space:nowrap;align-self:center}
a.ver:hover{color:var(--accent);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
.toplink{font-size:.8rem;color:var(--muted);text-decoration:none;flex-basis:100%}
.toplink:hover{text-decoration:underline}
details.more summary{cursor:pointer;font-size:.82rem;color:var(--fg);font-weight:700}
details.more>div{display:flex;flex-direction:column;gap:10px;margin-top:10px}

/* Layout: 左にカードの大きなプレビューと保存、右に「作るもの・メンバー・このメンバー・デザイン」の設定 */
:root{--accent:#b0388f; --accent-fg:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#f08ad0; --accent-fg:#2a0f22}}
:root[data-theme="dark"]{--accent:#f08ad0; --accent-fg:#2a0f22}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="toplink" href="./">← ツール一覧</a>
    <h1>メンバーカードメーカー</h1>
    <a class="ver" href="./#changelog" title="更新履歴を見る">v1.0 ・ 2026-10-31 公開</a>
    <p>メンバーの名前・写真・色を入れると、プロフィールカード、トレカ風カード、SNSアイコンを同じデザインで作れます。全員分をまとめてZIPで保存できます。</p>
  </header>
  <div class="grid">
    <div class="stage">
      <div class="board" id="board"><canvas id="cv"></canvas></div>
      <div class="actions">
        <button class="btn" id="saveOne" type="button">このカードを保存(PNG)</button>
        <button class="btn ghost" id="saveAll" type="button">全員分をZIPで保存</button>
        <span class="hint" id="sizeLabel"></span>
      </div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <p class="hint status" id="msg" role="status" aria-live="polite"></p>
    </div>

    <div class="panel">
      <fieldset>
        <legend>作るもの</legend>
        <div class="tabs" id="typeTabs">
          <button type="button" data-v="profile">プロフィールカード</button>
          <button type="button" data-v="tcg">トレカ風</button>
          <button type="button" data-v="icon">アイコン</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>メンバー</legend>
        <ul class="list" id="mList" aria-label="メンバーの一覧"></ul>
        <div class="btns">
          <button class="btn ghost small" id="mAdd" type="button">+ 追加</button>
          <button class="btn ghost small" id="mDup" type="button">複製</button>
          <button class="btn danger small" id="mDel" type="button">削除</button>
        </div>
        <details class="more">
          <summary>まとめて入れる</summary>
          <div>
            <label>1行に1人。「名前,期や肩書き,色,項目1,項目2,…」の順にカンマで区切ります(スプレッドシートから貼り付けてもOK)
              <textarea id="bulkText" rows="5" placeholder="なまえ,1期生,#ff7eb3,4月1日,いちご,よろしくね！"></textarea></label>
            <div class="btns"><button class="btn small" id="bulkAdd" type="button">一覧に追加</button><button class="btn ghost small" id="bulkReplace" type="button">一覧と入れ替える</button></div>
            <label>写真をまとめて選ぶ(ファイル名がメンバー名と同じなら、その人に入ります。いない名前は新しく追加します)<input type="file" id="bulkPhotos" accept="image/*" multiple></label>
          </div>
        </details>
      </fieldset>

      <fieldset id="memberBox">
        <legend>このメンバー</legend>
        <div class="row"><label>名前<input type="text" id="mName"></label><label style="flex:0 1 90px">メンバーカラー<input type="color" id="mColor"></label></div>
        <label>期・肩書きなど<input type="text" id="mSub" placeholder="例:1期生"></label>
        <label>写真<input type="file" id="mPhoto" accept="image/*"></label>
        <div class="btns"><span class="hint" id="mPhotoName" style="flex:1;align-self:center"></span><button class="mini" id="mPhotoClear" type="button">写真を外す</button></div>
        <div class="row"><label>写真の大きさ<input type="range" id="mS" min="50" max="300" step="1"></label></div>
        <div class="row"><label>写真の横位置<input type="range" id="mX" min="-100" max="100" step="1"></label><label>写真の縦位置<input type="range" id="mY" min="-100" max="100" step="1"></label></div>
        <div id="mFields" style="display:flex;flex-direction:column;gap:10px"></div>
        <div id="mTcg" style="display:flex;flex-direction:column;gap:10px">
          <div class="row"><label>レア度<select id="mRarity"><option>N</option><option>R</option><option>SR</option><option>SSR</option><option>UR</option></select></label><label>タイプ(属性)<input type="text" id="mAttr" placeholder="例:歌・キュート"></label></div>
          <div class="row" id="mStats"></div>
          <label>説明文<textarea id="mFlavor" rows="2" placeholder="例:いつも元気いっぱいのムードメーカー。"></textarea></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>デザイン(全員共通)</legend>
        <div class="row"><label>フォント<select id="dFont"></select></label></div>
        <div class="row"><label>グループ名など(下に小さく入ります)<input type="text" id="dGroup"></label></div>
        <div id="dProfile" style="display:flex;flex-direction:column;gap:10px">
          <div class="row"><label>大きさ<select id="dSize"><option value="4:5">縦長 1080×1350</option><option value="1:1">正方形 1080×1080</option><option value="16:9">横長 1600×900</option><option value="9:16">縦長 1080×1920</option></select></label><label>見出し<input type="text" id="dTitle"></label></div>
          <label>項目の名前(1行に1つ、6つまで)<textarea id="dLabels" rows="4"></textarea></label>
        </div>
        <div id="dTcg" style="display:flex;flex-direction:column;gap:10px">
          <label>能力の名前(1行に1つ、3つまで)<textarea id="dStats" rows="3"></textarea></label>
          <label class="check"><input type="checkbox" id="dHolo"> SR以上をキラキラ(ホロ)にする</label>
        </div>
        <div id="dIcon" style="display:flex;flex-direction:column;gap:10px">
          <label class="check"><input type="checkbox" id="dIconName"> 名前をまわりの輪に入れる</label>
          <label class="check"><input type="checkbox" id="dIconClear"> 丸の外を透明にする</label>
        </div>
        <label>背景画像(省略可)<input type="file" id="dBg" accept="image/*"></label>
        <div class="btns"><button class="mini" id="dBgClear" type="button">背景画像を外す</button></div>
        <div class="row" id="dBgDimBox"><label>背景画像にメンバーカラーを重ねる<input type="range" id="dBgDim" min="0" max="90" step="1"></label></div>
      </fieldset>

      <fieldset>
        <legend>作業の保存</legend>
        <p class="hint">作業中のメンバーと写真は、このブラウザに自動で保存されます。別のPCに移すときはファイルに書き出してください。</p>
        <div class="btns">
          <button class="btn ghost small" id="ioExport" type="button">ファイルに書き出す</button>
          <label class="btn ghost small" style="display:inline-flex;flex-direction:row">ファイルから読み込む<input type="file" id="ioImport" accept=".json,application/json" hidden></label>
          <button class="btn danger small" id="ioNew" type="button">新しく始める</button>
        </div>
        <p class="hint status" id="ioMsg" role="status"></p>
      </fieldset>
    </div>
  </div>
</div>

<script>
/* ===== 共通の部品(画像作成ツール) ===== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const R = Math.round;
const FONTS = [
  {name:"Zen Maru Gothic(丸ゴシック)", fam:"Zen Maru Gothic", w:700},
  {name:"M PLUS Rounded 1c(丸ゴシック太)", fam:"M PLUS Rounded 1c", w:800},
  {name:"Kiwi Maru(やわらか明朝)", fam:"Kiwi Maru", w:500},
  {name:"Klee One(手書き風)", fam:"Klee One", w:600},
  {name:"Yusei Magic(マーカー風)", fam:"Yusei Magic", w:400},
  {name:"Hachi Maru Pop(まるもじ)", fam:"Hachi Maru Pop", w:400},
  {name:"Mochiy Pop One(ポップ)", fam:"Mochiy Pop One", w:400},
  {name:"RocknRoll One(太ゴシック)", fam:"RocknRoll One", w:400},
  {name:"Dela Gothic One(極太)", fam:"Dela Gothic One", w:400},
  {name:"Noto Serif JP(明朝)", fam:"Noto Serif JP", w:600},
];
const fontOf = fam => FONTS.find(f => f.fam===fam) || FONTS[0];
const fontStr = (f, px, w) => `${w||f.w} ${Math.max(1,px)}px "${f.fam}", "Zen Maru Gothic", sans-serif`;
function fontOptions(sel, cur){ sel.innerHTML=''; for(const f of FONTS){ const o=document.createElement('option'); o.value=f.fam; o.textContent=f.name; if(f.fam===cur) o.selected=true; sel.appendChild(o); } }
const loadFont = (f, text) => document.fonts ? document.fonts.load(fontStr(f, 40), text || 'あA1').catch(()=>{}) : Promise.resolve();

/* 色 */
function rgbOf(hex){ const n = parseInt(String(hex||'#888888').replace('#','').padEnd(6,'0').slice(0,6), 16); return [n>>16, (n>>8)&255, n&255]; }
const hexOf = (r,g,b) => '#' + [r,g,b].map(v => clamp(R(v),0,255).toString(16).padStart(2,'0')).join('');
function mix(a, b, t){ const A=rgbOf(a), B=rgbOf(b); return hexOf(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }
const light = (c, t) => mix(c, '#ffffff', t), dark = (c, t) => mix(c, '#000000', t);
function rgba(hex, a){ const [r,g,b] = rgbOf(hex); return `rgba(${r},${g},${b},${clamp(a,0,1)})`; }
function lum(hex){ const [r,g,b] = rgbOf(hex); return (r*.299 + g*.587 + b*.114)/255; }
const onColor = hex => lum(hex) > .62 ? '#2a2230' : '#ffffff';   // 色の上にのせる文字の色

/* 画像 */
function loadImg(blob){ return new Promise((res, rej) => { if(!blob) return res(null); const u = URL.createObjectURL(blob), im = new Image();
  im.onload = () => { im._blob = blob; im._url = u; res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u; }); }
// 枠いっぱいに入れる(adj:大きさ%・位置-100〜100)
function drawCover(g, im, x, y, w, h, adj){
  if(!im) return; const iw = im.naturalWidth||im.width, ih = im.naturalHeight||im.height, a = adj||{};
  const k = Math.max(w/iw, h/ih) * (a.s ?? 100)/100, dw = iw*k, dh = ih*k;
  const ox = (a.x||0)/100*w*.5, oy = (a.y||0)/100*h*.5;   // 右・下へ動かす
  g.drawImage(im, x + (w-dw)/2 + ox, y + (h-dh)/2 + oy, dw, dh);
}
function drawContain(g, im, x, y, w, h){ if(!im) return; const iw = im.naturalWidth||im.width, ih = im.naturalHeight||im.height, k = Math.min(w/iw, h/ih); g.drawImage(im, x+(w-iw*k)/2, y+(h-ih*k)/2, iw*k, ih*k); }

/* 文字(日本語の行頭禁則つきで折り返す) */
const NO_START = '、。，．,.！？!?）)」』】〉》ーぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ～〜…‥';
function wrapText(g, text, maxW){
  const out = [];
  for(const para of String(text||'').split('\n')){
    if(para===''){ out.push(''); continue; }
    let line = '';
    for(const ch of [...para]){
      if(line && g.measureText(line+ch).width > maxW && !NO_START.includes(ch)){ out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  }
  return out;
}
// 枠に収まる大きさを探す(はじめの大きさから小さくしていく)
function fitText(g, text, f, maxW, maxH, size, lh=1.3, maxLines=99){
  let lines = [];
  for(let i=0;i<60;i++){
    g.font = fontStr(f, size); lines = wrapText(g, text, maxW);
    const wd = Math.max(0, ...lines.map(l => g.measureText(l).width));
    if((lines.length*size*lh <= maxH && wd <= maxW*1.01 && lines.length <= maxLines) || size < 6) break;
    size *= .94;
  }
  g.font = fontStr(f, size); return {size, lines};
}
// 1行に収める(長いときだけ小さくする)
function fitLine(g, text, f, maxW, size, w){ g.font = fontStr(f, size, w); const tw = g.measureText(text).width; if(tw > maxW) size *= maxW/tw; g.font = fontStr(f, size, w); return size; }
function drawTextLines(g, lines, x, y, size, lh, align='left', stroke=0, strokeColor='#000'){
  g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.miterLimit = 2;
  lines.forEach((l, i) => { const yy = y + size*lh*(i+.5); if(stroke>0){ g.lineWidth = stroke; g.strokeStyle = strokeColor; g.strokeText(l, x, yy); } g.fillText(l, x, yy); });
}
function star(g, x, y, r, n=5, inner=.45){ g.beginPath(); for(let i=0;i<n*2;i++){ const a = -Math.PI/2 + i*Math.PI/n, rr = i%2 ? r*inner : r; g.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr); } g.closePath(); }
function sparkle(g, x, y, r){ g.beginPath(); g.moveTo(x, y-r); g.quadraticCurveTo(x, y, x+r, y); g.quadraticCurveTo(x, y, x, y+r); g.quadraticCurveTo(x, y, x-r, y); g.quadraticCurveTo(x, y, x, y-r); g.fill(); }
function heart(g, x, y, s){ g.beginPath(); g.moveTo(x, y+s*.35); g.bezierCurveTo(x-s*.9, y-s*.25, x-s*.45, y-s*.95, x, y-s*.45); g.bezierCurveTo(x+s*.45, y-s*.95, x+s*.9, y-s*.25, x, y+s*.35); g.fill(); }
function rnd(i, k){ const x = Math.sin(i*127.1 + k*311.7) * 43758.5453; return x - Math.floor(x); }

/* 保存 */
let downloadsP = null;
try{ downloadsP = window.claude?.use ? window.claude.use('downloads') : null; }catch(e){}
async function saveFile(filename, data){
  const dl = downloadsP ? await Promise.resolve(downloadsP).catch(()=>null) : null;
  if(dl){ try{ await dl.save({filename, data}); return 'saved'; } catch(err){ if(err?.code==='declined') return 'declined'; if(err?.code==='rate_limited') return 'busy'; return 'failed'; } }
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 8000); return 'saved';
}

  if(typeof JSZip==='undefined') throw new Error('nozip');

  entries.forEach(e => { let n = e.name, k = 2; const m = n.replace(/(\.[^.]+)$/, ''), ext = n.slice(m.length); while(used.has(n)) n = `${m}(${k++})${ext}`; used.add(n); zip.file(n, e.blob); });

}

function makeStore(dbName){
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { try{ const r = indexedDB.open(dbName, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('kv', mode), st = t.objectStore('kv'), q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', st => st.get(k)), put: (k, v) => tx('readwrite', st => st.put(v, k)) };
}

    const dn = document.createElement('button'); dn.type='button'; dn.className='mini'; dn.textContent='↓'; dn.disabled = i===P.members.length-1; dn.setAttribute('aria-label','下へ');
    up.onclick = e => { e.stopPropagation(); [P.members[i-1], P.members[i]] = [P.members[i], P.members[i-1]]; if(P.cur===i) P.cur--; else if(P.cur===i-1) P.cur++; changed(); buildList(); };
    dn.onclick = e => { e.stopPropagation(); [P.members[i+1], P.members[i]] = [P.members[i], P.members[i+1]]; if(P.cur===i) P.cur++; else if(P.cur===i+1) P.cur--; changed(); buildList(); };
    li.append(th, sw, nm, up, dn); li.onclick = () => { P.cur = i; syncMember(); buildList(); redraw(); changed(true); }; ul.appendChild(li);
  });
  $('mDel').disabled = P.members.length <= 1;
}
$('mAdd').onclick = () => { P.members.push(newMember(P.members.length, {vals:[], flavor:'', name:`メンバー${P.members.length+1}`})); P.cur = P.members.length-1; changed(); refreshAll(); };
$('mDup').onclick = () => { const m = curM(); const c = {...structuredClone({...m, photo:null}), id:uid(), name:m.name+'のコピー', photo:m.photo}; P.members.splice(P.cur+1, 0, c); P.cur++; if(m.photo) ensureImg(c.id, m.photo).then(()=>{ buildList(); redraw(); }); changed(); refreshAll(); };
armButton($('mDel'), '削除', 'もう一度押すと削除', () => { if(P.members.length<=1) return; const m = curM(); imgs.delete(m.id); P.members.splice(P.cur,1); P.cur = Math.min(P.cur, P.members.length-1); changed(); refreshAll(); });
function parseBulk(text){
  const out = [];
  for(const line of String(text).split('\n')){ if(!line.trim()) continue;
    const cells = line.includes('\t') ? line.split('\t') : line.split(/[,，]/);   // タブ(スプレッドシート)かカンマで区切る
    const [name, sub, color, ...vals] = cells.map(s => s.trim());
    const o = {name: name || 'なまえ'}; if(sub!==undefined) o.sub = sub; if(/^#?[0-9a-f]{6}$/i.test(color||'')) o.color = color.startsWith('#') ? color : '#'+color; else if(color) vals.unshift(color);
    o.vals = vals; out.push(o); }
  return out;
}
function addBulk(replace){
  const rows = parseBulk($('bulkText').value); if(!rows.length){ msg('名前が入っていません。'); return; }
  if(replace){ P.members.forEach(m => imgs.delete(m.id)); P.members = []; }
  const base = P.members.length; rows.forEach((o, i) => P.members.push(newMember(base+i, {flavor:'', ...o})));
  P.cur = base; changed(); refreshAll(); msg(`${rows.length}人を${replace?'入れ替えました':'追加しました'}。`);
}
$('bulkAdd').onclick = () => addBulk(false);
armButton($('bulkReplace'), '一覧と入れ替える', 'もう一度押すと入れ替える', () => addBulk(true));
const stemOf = n => n.replace(/\.[^.]+$/, '').trim().normalize('NFKC');
$('bulkPhotos').addEventListener('change', async e => {
  const fs = [...e.target.files]; e.target.value = ''; let hit = 0, add = 0;
  for(const f of fs){ const st = stemOf(f.name); let m = P.members.find(x => (x.name||'').normalize('NFKC').trim() === st);
    if(!m){ m = newMember(P.members.length, {name: st, vals:[], flavor:''}); P.members.push(m); add++; } else hit++;
    m.photo = f; m.s = 100; m.x = 0; m.y = 0; await ensureImg(m.id, f); }
  changed(); refreshAll(); msg(`写真を入れました(名前が合った人 ${hit}人・新しく追加 ${add}人)。`);
});

/* ===== このメンバー ===== */
function syncMember(){
  const m = curM(); if(!m) return;
  $('mName').value = m.name||''; $('mColor').value = m.color; $('mSub').value = m.sub||''; $('mS').value = m.s??100; $('mX').value = m.x||0; $('mY').value = m.y||0;
  $('mPhotoName').textContent = m.photo ? '写真を使用中' : 'まだ写真がありません';
  $('mRarity').value = m.rarity||'R'; $('mAttr').value = m.attr||''; $('mFlavor').value = m.flavor||'';
  [$('mS'),$('mX'),$('mY')].forEach(el => el.dispatchEvent(new Event('sync')));
  // 項目(プロフィール)
  const box = $('mFields'); box.innerHTML = '';
  (P.labels||[]).filter(l => l.trim()).slice(0,6).forEach((l, i) => {
    const lab = document.createElement('label'); lab.textContent = l; const inp = document.createElement('input'); inp.type = 'text'; inp.value = (m.vals||[])[i] || '';
    inp.addEventListener('input', () => { m.vals = m.vals || []; m.vals[i] = inp.value; redraw(); changed(true); }); lab.appendChild(inp); box.appendChild(lab); });
  const sb = $('mStats'); sb.innerHTML = '';
  (P.statLabels||[]).filter(l => l.trim()).slice(0,3).forEach((l, i) => {
    const lab = document.createElement('label'); lab.textContent = l; const inp = document.createElement('input'); inp.type = 'number'; inp.min = 0; inp.max = 999; inp.value = (m.stats||[])[i] ?? 50;
    inp.addEventListener('input', () => { m.stats = m.stats || []; m.stats[i] = +inp.value; redraw(); changed(true); }); lab.appendChild(inp); sb.appendChild(lab); });
}
const bindM = (id, key, num, after) => $(id).addEventListener('input', () => { const m = curM(); m[key] = num ? +$(id).value : $(id).value; if(after) after(); redraw(); changed(true); });
bindM('mName','name',false,buildList); bindM('mColor','color',false,buildList); bindM('mSub','sub'); bindM('mS','s',true); bindM('mX','x',true); bindM('mY','y',true);
bindM('mAttr','attr'); bindM('mFlavor','flavor'); $('mRarity').addEventListener('change', () => { curM().rarity = $('mRarity').value; redraw(); changed(true); });
for(const [id, f] of [['mS', v=>v+'%'], ['mX', v=>v], ['mY', v=>v]]){ const upd = showVal($(id), f); $(id).addEventListener('sync', upd); $(id).addEventListener('dblclick', () => { $(id).value = id==='mS'?100:0; $(id).dispatchEvent(new Event('input')); }); }
$('mPhoto').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return; const m = curM(); m.photo = f; m.s = 100; m.x = 0; m.y = 0;
  if(!await ensureImg(m.id, f)){ m.photo = null; msg('写真を読み込めませんでした。PNGかJPEGを選んでください。'); } syncMember(); buildList(); redraw(); changed(); });
$('mPhotoClear').onclick = () => { const m = curM(); m.photo = null; imgs.delete(m.id); syncMember(); buildList(); redraw(); changed(); };

/* ===== デザイン ===== */
function syncDesign(){
  $('typeTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v===P.type));
  fontOptions($('dFont'), P.font); $('dGroup').value = P.group||''; $('dSize').value = P.size; $('dTitle').value = P.title||'';
  $('dLabels').value = (P.labels||[]).join('\n'); $('dStats').value = (P.statLabels||[]).join('\n'); $('dHolo').checked = !!P.holo;
  $('dIconName').checked = !!P.iconName; $('dIconClear').checked = !!P.iconClear; $('dBgDim').value = P.bgDim ?? 55; $('dBgDimBox').hidden = !P.bg;
  $('dProfile').hidden = P.type!=='profile'; $('dTcg').hidden = P.type!=='tcg'; $('dIcon').hidden = P.type!=='icon';
  $('mFields').hidden = P.type!=='profile'; $('mTcg').hidden = P.type!=='tcg';
}
$('typeTabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; P.type = b.dataset.v; syncDesign(); syncMember(); redraw(); changed(true); });
const bindD = (id, fn, ev='input') => $(id).addEventListener(ev, () => { fn($(id)); redraw(); changed(true); });
bindD('dFont', el => { P.font = el.value; loadFont(fontOf(P.font), P.members.map(m=>m.name).join('')+'0123456789').then(redraw); }, 'change');
bindD('dGroup', el => P.group = el.value); bindD('dSize', el => P.size = el.value, 'change'); bindD('dTitle', el => P.title = el.value);
bindD('dLabels', el => { P.labels = el.value.split('\n').slice(0,6); syncMember(); });
bindD('dStats', el => { P.statLabels = el.value.split('\n').slice(0,3); syncMember(); });
bindD('dHolo', el => P.holo = el.checked, 'change'); bindD('dIconName', el => P.iconName = el.checked, 'change'); bindD('dIconClear', el => P.iconClear = el.checked, 'change');
bindD('dBgDim', el => P.bgDim = +el.value); showVal($('dBgDim'), v => v+'%');
$('dBg').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return; P.bg = f; await ensureImg('bg', f); syncDesign(); redraw(); changed(); });
$('dBgClear').onclick = () => { P.bg = null; imgs.delete('bg'); syncDesign(); redraw(); changed(); };

/* ===== 保存 ===== */
const msg = t => { $('msg').textContent = t; };
const bar = p => { $('bar').style.width = (p*100).toFixed(1)+'%'; };
const TYPE_NAME = {profile:'プロフィール', tcg:'トレカ', icon:'アイコン'};
const fileOf = m => `${TYPE_NAME[P.type]}_${safeName(m.name)}.png`;
async function prep(){ await loadFont(fontOf(P.font), P.members.map(m => m.name+m.sub+(m.vals||[]).join('')+m.attr+m.flavor).join('')+P.group+P.title+(P.labels||[]).join('')+(P.statLabels||[]).join('')+'0123456789No./'); }
$('saveOne').onclick = async () => { await prep(); const m = curM(), c = render(document.createElement('canvas'), m, P.cur); const r = await saveFile(fileOf(m), await toBlob(c)); msg(resultMsg(r, `${fileOf(m)} を保存しました。`)); };
$('saveAll').onclick = async () => {
  $('saveAll').disabled = true; bar(0);
  try{ await prep(); const entries = [];
    for(let i=0;i<P.members.length;i++){ const m = P.members[i]; entries.push({name: fileOf(m), blob: await toBlob(render(document.createElement('canvas'), m, i))}); bar((i+1)/P.members.length*.85); msg(`作成中… ${i+1} / ${P.members.length} 人`); await tick(); }
    const r = await saveZip(entries, `${TYPE_NAME[P.type]}_${P.members.length}人_${stamp()}.zip`, p => bar(.85 + p*.15));
    msg(resultMsg(r, `${P.members.length}人分をZIPで保存しました。`));
  }catch(e){ msg(e && e.message==='nozip' ? 'ZIPの作成機能を読み込めませんでした。ネットにつないだ状態でページを開き直してください。' : '保存できませんでした。もう一度試してください。'); }
  finally{ $('saveAll').disabled = false; setTimeout(()=>bar(0), 1500); }
};

/* ===== 作業の保存 ===== */
const store = makeStore('member-card');
let saveT = null;
function changed(light){ clearTimeout(saveT); saveT = setTimeout(() => store.put('project', P).catch(()=>{}), light ? 600 : 200); }
const blobToURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const urlToBlob = async u => (await fetch(u)).blob();
$('ioExport').onclick = async () => {
  try{ const out = {...P, app:'member-card', bg: P.bg ? await blobToURL(P.bg) : null, members: []};
    for(const m of P.members) out.members.push({...m, photo: m.photo ? await blobToURL(m.photo) : null});
    const r = await saveFile(`membercard_${stamp()}.json`, new Blob([JSON.stringify(out)], {type:'application/json'}));
    $('ioMsg').textContent = resultMsg(r, '書き出しました(写真も含まれています)。'); }catch(e){ $('ioMsg').textContent = '書き出せませんでした。'; }
};
$('ioImport').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{ const d = JSON.parse(await f.text()); if(d.app!=='member-card' || !Array.isArray(d.members)) throw 0;
    d.bg = d.bg ? await urlToBlob(d.bg) : null; for(const m of d.members) m.photo = m.photo ? await urlToBlob(m.photo) : null;
    delete d.app; await loadProject(d); changed(); $('ioMsg').textContent = `「${f.name}」を読み込みました。`; }
  catch(err){ $('ioMsg').textContent = '読み込めませんでした。このツールで書き出したファイル(.json)を選んでください。'; } });
armButton($('ioNew'), '新しく始める', 'もう一度押すと全部消します', async () => { imgs.clear(); P = newProject(); await loadProject(P); changed(); $('ioMsg').textContent = '新しく始めました。'; });
async function loadProject(d){
  P = {...newProject(), ...d}; P.members = (P.members||[]).length ? P.members : newProject().members; imgs.clear();
  for(const m of P.members) if(m.photo) await ensureImg(m.id, m.photo);
  if(P.bg) await ensureImg('bg', P.bg);
  refreshAll();
}
function refreshAll(){ syncDesign(); syncMember(); buildList(); redraw(); }

/* ===== 起動 ===== */
(async () => {
  try{ const d = await store.get('project'); if(d && Array.isArray(d.members)) await loadProject(d); else refreshAll(); }catch(e){ refreshAll(); }
  if(document.fonts) document.fonts.ready.then(redraw);
  loadFont(fontOf(P.font)).then(redraw);
})();
window.__tool = {get P(){ return P; }, render};   // 動作確認用
</script>
</body>
</html>
